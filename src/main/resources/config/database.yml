spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      source:
        url: jdbc:mysql://${ORDER_DB_HOST:localhost}:${ORDER_DB_PORT:3318}/${ORDER_DB_DATABASE:product}
        username: ${ORDER_DB_USER:root}
        password: ${ORDER_DB_PASSWORD:root}
      replica:
        url: jdbc:mysql://${ORDER_DB_REPLICA_HOST:localhost}:${ORDER_DB_REPLICA_PORT:3318}/${ORDER_DB_REPLICA_DATABASE:product}
        username: ${ORDER_DB_REPLICA_USER:root}
        password: ${ORDER_DB_REPLICA_PASSWORD:root}
      maximum-pool-size: ${DB_POOL_SIZE:10}

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}

  jpa:
    show-sql: true
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        show_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
      ejb:
        naming_strategy: org.hibernate.cfg.ImprovedNamingStrategy