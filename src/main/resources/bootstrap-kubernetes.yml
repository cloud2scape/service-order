spring:
  config:
    activate:
      on-cloud-platform: kubernetes
      on-profile: kubernetes
  cloud:
    config:
      enabled: true
    kubernetes:
      config:
        enabled: true
        name: config-order
        namespace: default
      loadbalancer:
        mode: service

eureka:
  client:
    fetch-registry: false
    register-with-eureka: false
    enabled: false
